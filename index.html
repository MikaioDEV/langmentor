    <!-- Game Content -->
    <div
      class="container mx-auto p-8 mt-20 bg-white shadow-lg rounded-lg mb-16"
    >
      <div class="p-4">
        <div class="mb-2 text-orange-500 font-bold">Learning English</div>
        <!-- Frase em inglês com a lacuna -->
        <p id="sentence" class="text-xl font-semibold text-primary mb-4">
          Where are you? – I am at
          <input
            id="answer-input"
            type="text"
            class="border-b-2 border-gray-400 focus:border-primary outline-none text-center"
            style="width: 5ch; max-width: 30ch"
            oninput="this.style.width = (this.value.length > 0 ? this.value.length : 5) + 'ch';"
          />
        </p>
        <!-- Tipo da palavra -->
        <!-- <div class="bg-gray-100 rounded-full px-4 py-2 text-gray-700 inline-block">substantivo, singular</div> -->

      <!-- Frase completa em português -->

          Onde você está? Eu estou em casa.
        </p>
      </div>
      <!-- Botão de aprendizado -->
      <div class="flex justify-end p-4 mt-4">
        <button
          id="check-btn"
          class="bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90"
        >
          Check
        </button>
        <button
          id="next-btn"
          class="bg-green-500 text-white px-4 py-2 rounded-full hover:bg-green-600 hidden"
        >
          Next
        </button>
        <button
          id="show-answer-btn"
          class="bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90 hidden ml-4"
        >
          Show Answer
        </button>
      </div>
      <!-- Mensagem de feedback (correta ou incorreta) -->
      <div id="feedback-message" class="hidden text-center mt-4"></div>
    </div>

    <script src="scripts/sentences.js"></script>
    <script src="scripts/game_complete.js"></script>

    <script>
      donate();
  
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/scripts/service-worker.js")
            .then((registration) => {
              console.log(
                "Service Worker registered with scope:",
                registration.scope,
              );
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }

      let deferredPrompt;

      window.addEventListener("beforeinstallprompt", (event) => {
        // Previne o prompt padrão
        event.preventDefault();

        // Guarda o evento para disparar mais tarde
        let deferredPrompt = event;

        // Exibe o modal SweetAlert
        Swal.fire({
          title: "Install WebApp",
          html: `
                        🌟 Works offline<br>
                        ⚡ Quick to launch<br>
                        🚀 One-tap learning

                    `,
          icon: "info",
          showCancelButton: true,
          confirmButtonText: "Install Now 💖",
          cancelButtonText: "Maybe Later 😞",
          confirmButtonColor: "#0F8AFD",
          cancelButtonColor: "#b9babd",
        }).then((result) => {
          if (result.isConfirmed) {
            // Exibe o prompt de instalação
            deferredPrompt.prompt();

            // Aguardar a resposta do usuário ao prompt
            deferredPrompt.userChoice.then((choiceResult) => {
              if (choiceResult.outcome === "accepted") {
                console.log("Usuário aceitou instalar a PWA");
              } else {
                console.log("Usuário recusou instalar a PWA");
              }
              deferredPrompt = null; // Limpa o evento
            });
          }
        });
      });
    </script>
