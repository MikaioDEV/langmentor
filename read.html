<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langmentor AI - Read Practice</title>
    <script src="scripts/tailwind.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0F8AFD", // Nova cor primária
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/call_to_donate.js"></script>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-primary p-2 md:p-4 fixed top-0 w-full z-10">
      <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <img src="icon.svg" alt="Icon" class="w-8 h-8" />
          <h1 class="text-white text-center text-xl md:text-2xl font-bold">
            Langmentor
          </h1>
        </div>
        <button
          id="logoutButton"
          class="bg-red-500 text-white font-semibold px-2 py-1 md:px-4 md:py-2 rounded hover:bg-red-600 text-sm md:text-base hidden"
        >
          Logout
        </button>
      </div>
    </nav>
    <div class="bg-white shadow-md fixed bottom-0 w-full">
      <div class="container mx-auto px-4 py-2 flex justify-around text-center">
        <a
          href="index.html"
          class="flex flex-col items-center text-gray-600 hover:text-primary"
        >
          <i class="fas fa-book-open"></i>
          <span class="text-xs">Learn</span>
        </a>
        <a
          href="read.html"
          class="flex flex-col items-center text-primary font-semibold"
        >
          <i class="fas fa-book"></i>
          <span class="text-xs">Read</span>
        </a>
        <a
          href="https://buy.stripe.com/6oE5oa8H21m93i86oq"
          class="flex flex-col items-center text-gray-600 hover:text-primary"
        >
          <i class="fas fa-donate"></i>
          <span class="text-xs">Premium</span>
        </a>
        <a
          href="community.html"
          class="flex flex-col items-center text-gray-600 hover:text-primary"
        >
          <i class="fas fa-users"></i>
          <span class="text-xs">Network</span>
        </a>
        <a
          href="profile.html"
          class="flex flex-col items-center text-gray-600 hover:text-primary"
        >
          <i class="fas fa-user"></i>
          <span class="text-xs">Profile</span>
        </a>
      </div>
    </div>
    <!-- Main Content -->
    <div
      class="container mx-auto p-8 mt-20 bg-white shadow-lg rounded-lg mb-16"
    >
      <p class="text-gray-400 mt-2 mb-4">
        Click at word to listen pronunciation!
      </p>

      <div id="text-container" class="mb-4 text-xl">
        <!-- Texto será inserido aqui -->
      </div>

      <button
        id="read-button"
        class="bg-primary text-white font-semibold px-4 py-2 rounded inline-flex items-center"
      >
        🎙️ Read
      </button>
      <p id="status" class="text-gray-600 mt-2">
        Click "Read" and start reading aloud!
      </p>

      <!-- Div para exibir o que o usuário está falando -->
      <div
        id="transcript-container"
        class="mt-4 bg-gray-200 p-4 rounded-lg text-lg"
      >
        <p>
          <strong>What you're saying:</strong> <span id="transcript"></span>
        </p>
      </div>
      <button
        id="restart-button"
        class="bg-primary mt-8 text-white font-semibold px-4 py-2 rounded inline-flex items-center"
        style="display: none"
      >
        🔄 Read another
      </button>
    </div>

    <script src="scripts/phrases-read.js"></script>
    <script src="scripts/game_read.js"></script>
    <!-- <script src="https://mikaio.dev/magic-link-auth/auth.js"></script> -->
  </body>
</html>
