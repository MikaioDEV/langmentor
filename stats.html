
  <!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Langmentor AI</title>
        <script src="tailwind.js"></script>
        <script>
            // Configuração para personalizar a cor primária
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: "#0F8AFD", // Nova cor primária
                        },
                    },
                },
            };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="call_to_donate.js"></script>
    </head>
    <body class="bg-white">
        <!-- Navbar -->
        <nav class="bg-primary p-2 md:p-4">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <img src="icon.svg" alt="Icon" class="w-8 h-8" />
                    <h1 class="text-white text-center text-xl md:text-2xl font-bold">LangmentorAI</h1>
                </div>
                <button id="logoutButton" class="bg-red-500 text-white font-semibold px-2 py-1 md:px-4 md:py-2 rounded hover:bg-red-600 text-sm md:text-base hidden">
                    Logout
                </button>
            </div>
        </nav>
        <!-- Tabs -->
        <div class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-2 flex space-x-4 overflow-x-auto whitespace-nowrap">
                <a href="index.html" class="text-gray-600 hover:text-primary pb-2">Learn</a>
                <a href="read.html" class="text-gray-600 hover:text-primary pb-2">Read</a>
                <a href="index.html" class="text-primary border-b-4 border-primary font-semibold pb-2">Stats</a>
                <a href="https://buy.stripe.com/6oE5oa8H21m93i86oq" class="text-gray-600 hover:text-primary pb-2">Donate</a>
                <!-- <a href="info.html" class="text-gray-600 hover:text-primary pb-2">Info</a>
                <a href="pricing.html" class="text-gray-600 hover:text-primary pb-2">Pricing</a>
                <a href="profile.html" class="text-gray-600 hover:text-primary pb-2">Profile</a> -->
            </div>
        </div>
        <!-- Game Content -->
        <div class="container mx-auto mt-6 p-6 shadow-lg rounded-lg">
            <h2 class="text-xl font-bold text-primary text-center mb-4">Learning Dashboard</h2>
        
            <!-- Usamos apenas grid-cols-1 para uma coluna em todas as resoluções -->
            <div class="grid grid-cols-1 gap-4 text-sm">
                


                <!-- Dias Consecutivos -->
                <div class="bg-white p-3 rounded shadow flex flex-col items-center mt-6">
                    <h2>🔥 Rush</h2>
                    <span class="font-bold text-primary text-xl">7 days</span>
                </div>
        
                <!-- Vocabulário Aprendido -->
                <div class="bg-white p-3 rounded shadow flex flex-col items-center mt-6">
                    <h2>📚 Vocabulary</h2>
                    <span class="font-bold text-primary text-xl">85 words</span>
                </div>

                <!-- Tempo de Estudo -->
                <div class="bg-white p-3 rounded shadow flex flex-col items-center mt-6">
                    <h2>⏳ Learning</h2>
                    <span class="font-bold text-primary text-xl">12h 35min</span>
                </div>
        
        
                <!-- Nível de Fluência -->
                <div class="bg-white p-3 rounded shadow flex flex-col items-center mt-6">
                    <h2>🚀 Level</h2>
                    <span class="font-bold text-primary text-xl">A2 - Basic</span>
                </div>
            </div>
            <br><br><br>
            <form class="space-y-4">
                <!-- Select your native language -->
                <div>
                    <label for="native-language" class="block text-sm font-medium text-gray-700">Native Language</label>
                    <select id="native-language" name="native-language" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                        <option value="" disabled selected>Select your native language</option>
                        <option value="english">English</option>
                        <option value="portuguese">Portuguese</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="german">German</option>
                        <option value="chinese">Chinese</option>
                        <option value="japanese">Japanese</option>
                        <!-- Add more language options as needed -->
                    </select>
                </div>
        
                <!-- Select the language you are learning -->
                <div>
                    <label for="learning-language" class="block text-sm font-medium text-gray-700">Learning Language</label>
                    <select id="learning-language" name="learning-language" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                        <option value="" disabled selected>Select the language you are learning</option>
                        <option value="english">English</option>
                        <option value="portuguese">Portuguese</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="german">German</option>
                        <option value="chinese">Chinese</option>
                        <option value="japanese">Japanese</option>
                        <!-- Add more language options as needed -->
                    </select>
                </div>
        
                <!-- Submit button -->
                <div >
                    <button type="submit" class="mt-4 px-4 py-2 bg-primary text-white font-bold rounded shadow hover:bg-primary-dark">Save Settings</button>
                </div>
            </form>
        </div>
       

    </body>
</html>
